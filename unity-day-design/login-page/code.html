<input class="w-full h-[56px] pl-[52px] pr-5 bg-background border border-outline-variant rounded-[20px] font-body-md text-body-md input-focus-ring transition-all" id="identifier" name="identifier" placeholder="ornek@mail.com" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack-gap-sm">
<div class="flex items-center justify-between px-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
                            Şifre
                        </label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">
                            Şifremi Unuttum
                        </a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full h-[56px] pl-[52px] pr-14 bg-background border border-outline-variant rounded-[20px] font-body-md text-body-md input-focus-ring transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-5 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<span class="z-10">Giriş Yap</span>
<span class="material-symbols-outlined text-[20px] z-10 transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
<div class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/10 to-white/0 -translate-x-full group-hover:animate-[shimmer_2s_infinite]"></div>

<script>
        // Micro-interaction for shimmer effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shimmer {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(100%); }
            }
        `;
        document.head.appendChild(style);

        // Simple password visibility toggle
        const toggleBtn = document.querySelector('button span:contains("visibility")') || document.querySelector('button span.material-symbols-outlined:last-of-type');
        if (toggleBtn) {
            const passwordInput = document.getElementById('password');
            toggleBtn.parentElement.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleBtn.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
    </script>
