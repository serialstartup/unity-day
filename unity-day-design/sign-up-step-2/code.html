<div class="fixed bottom-0 left-0 w-full h-24 bg-gradient-to-t from-secondary-container/20 to-transparent pointer-events-none"></div>
<script>
        // Micro-interactions for input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple visibility toggle for password
        const passToggle = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        if (passToggle && passInput) {
            passToggle.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                passToggle.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
